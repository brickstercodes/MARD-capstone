[project]
name = "mard"
version = "0.1.0"
license = { file = "LICENSE" }
description = "Metadata-Augmented Recursive Decomposition — a metadata envelope that accumulates across recursive language model calls"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "openai>=2.53",
]

[project.optional-dependencies]
# Split out because the measurement tracks (T3) and corpus track (T4) do not
# need each other's heavy native dependencies to run their own suites.
ingest = ["pymupdf>=1.24", "pdfplumber>=0.11"]
eval = ["numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "runlog",
    "ingest",
    "envelope",
    "plan",
    "orchestrate",
    "eval",
    "corpus",
    "provider",
    "vanilla",
    "mard",
]

[tool.setuptools.package-data]
# EXAMPLE_PLAN.json is the worked example of the Tier 1 → Tier 2 contract and
# `plan.EXAMPLE_PLAN_PATH` points at it. Without this it ships only in an
# editable install, so the path would break in exactly the place it matters most
# — the reproducibility artefact, which is installed from a wheel by someone who
# has never seen this repo.
plan = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
# Code samples in README.md and the handoff docs are written to be read, not
# executed. Letting the formatter explode aligned keyword arguments onto one
# line each makes the docs worse and produces diff noise on every run.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
strict = true
# Tests are type-checked too — a test that no longer matches the code it covers
# is how a green suite starts lying. They are not held to full annotation
# coverage: pytest fixtures are untyped by convention, and annotating every
# `def test_x(plan, logger)` buys nothing the assertions do not already say.
files = ["runlog", "plan", "orchestrate", "tests", "ingest", "envelope", "provider", "vanilla"]
# Third-party PDF and model SDKs ship no stubs; failing on those would train
# everyone to ignore mypy output, which defeats the point of running it.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# PyMuPDF ships py.typed with inline hints and no stubs, so its constructor reads as
# untyped on some wheel builds (Python 3.14 + mypy 2.3) and typed on others (3.11).
# ingest.pdf is the only module allowed to touch that surface; exempting it here rather
# than with inline `# type: ignore` avoids strict mode's warn_unused_ignores flagging
# the suppression as dead on whichever toolchain did not need it.
[[tool.mypy.overrides]]
module = "ingest.pdf"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
